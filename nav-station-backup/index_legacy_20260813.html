function card(p,i){let c=cat(p.category);return `<article class="project ${i===0?'featured':''}" data-id="${p.id}" style="--a:${p.a};--b:${p.b};animation-delay:${i*35}ms"><div class="preview"><span class="glyph">${p.glyph}</span><span class="visual-note">${esc(c[1])} · ${p.year}</span><strong class="visual-title">${esc(p.title)}</strong></div><span class="status">${esc(p.status)}</span><div class="card-body"><div class="meta">${c[2]} ${esc(c[1])} · ${p.year}</div><div class="title-line"><h2>${esc(p.title)}</h2><span class="open">↗</span></div><p class="desc">${esc(p.tagline)}</p><div class="tags">${p.tech.slice(0,4).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div></article>`}
function render(){filters();let list=projects.filter(p=>(current==='all'||p.category===current)&&(`${p.title} ${p.tagline} ${p.description} ${p.tech.join(' ')}`).toLowerCase().includes(query.toLowerCase()));$('#grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">没有匹配的项目，换个关键词试试。</div>';document.querySelectorAll('.project').forEach(x=>x.onclick=()=>location.hash='#/project/'+x.dataset.id)}
function action(label,url,primary=false){return url?`<a class="action ${primary?'primary':''}" href="${esc(url)}" ${url.startsWith('http')?'target="_blank" rel="noopener"':''}>${label} ↗</a>`:''}
const blueprintPlan={prediction:['scene','flow','architecture','relation'],web:['scene','flow','architecture','relation'],ai:['flow','architecture','relation'],quant:['flow','architecture','relation'],opensource:['scene','architecture'],content:['scene','flow']};
function node(label,strong=false){return `<div class="flow-node ${strong?'strong':''}">${esc(label)}</div>`}
function diagram(kind,p){let start=p.category==='content'?'读者 / 作者':p.category==='quant'?'研究员':p.category==='ai'?'运营团队':p.category==='web'?'业务团队':'市场参与者';let input=p.category==='content'?'灵感与笔记':p.category==='quant'?'市场与历史数据':p.category==='ai'?'内容与任务':p.category==='web'?'订单与运营数据':'实时市场数据';let outcome=p.category==='content'?'可阅读的知识资产':p.category==='quant'?'可验证的研究结论':p.category==='ai'?'稳定的自动化执行':p.category==='web'?'可管理的业务闭环':'更快的决策与交易';let product=esc(p.title);if(kind==='scene')return `<article class="diagram"><div class="diagram-title"><span>◌</span>业务场景图</div><div class="flow-wrap"><div class="scenario">${node(start)}<i class="scenario-arrow">→</i>${node(p.features[0],true)}<i class="scenario-arrow">→</i>${node(outcome)}</div></div><p class="diagram-caption">明确谁在什么场景下，通过项目获得何种业务价值。</p></article>`;if(kind==='flow')return `<article class="diagram"><div class="diagram-title"><span>→</span>业务流程图</div><div class="flow-wrap"><div class="flow">${node(input)}<i class="flow-arrow">→</i>${node(p.features[0],true)}<i class="flow-arrow">→</i>${node(p.features[1])}<i class="flow-arrow">→</i>${node(outcome)}</div></div><p class="diagram-caption">从输入到交付的关键路径，帮助快速理解项目运行方式。</p></article>`;if(kind==='architecture')return `<article class="diagram"><div class="diagram-title"><span>▦</span>功能架构图</div><div class="architecture"><div class="arch-row"><b class="arch-label">入口层</b><div class="arch-items"><span class="arch-item">${esc(start)}</span><span class="arch-item">项目界面</span></div></div><div class="arch-row"><b class="arch-label">能力层</b><div class="arch-items">${p.features.slice(0,3).map(x=>`<span class="arch-item">${esc(x)}</span>`).join('')}</div></div><div class="arch-row"><b class="arch-label">基础层</b><div class="arch-items">${p.tech.slice(0,4).map(x=>`<span class="arch-item">${esc(x)}</span>`).join('')}</div></div></div><p class="diagram-caption">将入口、业务能力和技术基础分层，标记主要功能边界。</p></article>`;return `<article class="diagram wide"><div class="diagram-title"><span>⌘</span>系统关系图</div><div class="relation-wrap"><div class="relation"><i class="relation-line"></i><div class="relation-col"><div class="relation-node">${esc(input)}</div><div class="relation-node">外部数据 / 平台</div></div><div class="relation-core">${product}<br><small>核心服务</small></div><div class="relation-col"><div class="relation-node">${esc(start)}</div><div class="relation-node">报告 / 决策 / 文档</div></div></div></div><p class="diagram-caption">项目作为中心节点，连接输入数据、外部平台和最终使用者。</p></article>`}
function blueprint(p){let types=blueprintPlan[p.category]||['scene','flow'];return `<section class="blueprint"><div class="blueprint-head"><div><h2>项目蓝图</h2><p>按项目复杂度选择 ${types.length} 类视图，展示业务、流程与系统关系。</p></div><span class="blueprint-note">${types.length} 张项目图</span></div><div class="diagram-grid">${types.map(type=>diagram(type,p)).join('')}</div></section>`}
function showDetail(id){let p=projects.find(x=>x.id===id);if(!p){location.hash='#/';return}let c=cat(p.category);$('#home').style.display='none';let d=$('#detail');d.classList.add('show');d.innerHTML=`<a class="back" href="#/">← 返回全部项目</a><section class="detail-hero"><div class="detail-visual" style="--a:${p.a};--b:${p.b}"><span class="glyph">${p.glyph}</span><h2>${esc(p.title)}</h2></div><div class="detail-info"><h1>${esc(p.title)}</h1><p>${esc(p.tagline)}</p><div class="chips"><span class="chip">${esc(p.status)}</span><span class="chip">${c[2]} ${c[1]}</span><span class="chip">${p.year}</span></div><div class="actions">${action('访问站点',p.links.home,true)}${action('查看源码',p.links.github)}${action('项目文档',p.links.docs)}</div></div></section><section class="detail-grid"><article class="detail-card"><h3>项目简介</h3><p>${esc(p.description)}</p></article><article class="detail-card"><h3>核心特性</h3><ul>${p.features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="detail-card"><h3>技术栈</h3><div class="tags">${p.tech.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></article><article class="detail-card"><h3>项目档案</h3><ul><li>项目 ID：${esc(p.id)}</li><li>所属分类：${esc(c[1])}</li><li>启动年份：${p.year}</li><li>当前状态：${esc(p.status)}</li></ul></article></section>${blueprint(p)}`;window.scrollTo({top:0,behavior:'smooth'})}
function router(){let m=location.hash.match(/^#\/project\/(.+)/);if(m)showDetail(decodeURIComponent(m[1]));else{$('#home').style.display='block';$('#detail').classList.remove('show');render();window.scrollTo({top:0,behavior:'smooth'})}}$('#search').oninput=e=>{query=e.target.value;render()};$('#theme').onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('hq-theme',d.dataset.theme)};document.documentElement.dataset.theme=localStorage.getItem('hq-theme')||'';window.addEventListener('hashchange',router);render();router();
</script>
</body></html>
